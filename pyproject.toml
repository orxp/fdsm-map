[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "fdsm-map"
version = "0.1.0.dev0"
description = "Transform uniformly sampled one-dimensional signals into fractional derivative spectrum maps."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
  { name = "Chihyun Park" },
]
keywords = [
  "fractional derivative",
  "signal processing",
  "spectrum",
  "spectroscopy",
  "convolutional neural network",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = [
  "build>=1.2",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
]

[project.scripts]
fdsm = "fdsm.cli:main"

[project.urls]
Repository = "https://github.com/orxp/fdsm-map"
Issues = "https://github.com/orxp/fdsm-map/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fdsm"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
